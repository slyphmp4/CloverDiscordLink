name: CloverDiscordLink
main: com.slyph.cloverdiscordlink.CloverDiscordLink
version: '${version}'
api-version: '26.2'
author: slyph
website: https://github.com/slyphmp4/CloverDiscordLink
description: Discord account linking, access control, and two-way chat bridge for Minecraft.
commands:
  dchat:
    description: Manage CloverDiscordLink.
    usage: /<command> reload
    permission: dchat.reload
permissions:
  dchat.reload:
    description: Allows reloading CloverDiscordLink configuration.
    default: op
