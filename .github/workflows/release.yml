name: Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Unable to determine project version from build.gradle.kts" >&2
            exit 1
          fi

          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi

          shopt -s nullglob
          jars=(build/libs/CloverDiscordLink-*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one CloverDiscordLink JAR, found ${#jars[@]}." >&2
            exit 1
          fi

          gh release create "$tag" "${jars[0]}" \
            --target "$GITHUB_SHA" \
            --title "CloverDiscordLink ${tag}" \
            --notes-file CHANGELOG.md \
            --latest
